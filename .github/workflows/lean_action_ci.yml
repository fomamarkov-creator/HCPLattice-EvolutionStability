name: Lean Action CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl https://lean-lang.org -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Generate manifest and fetch Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Build Lean modules
        run: lake build
